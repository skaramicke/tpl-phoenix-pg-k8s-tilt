apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kustomize-example
spec:
  project: default
  source:
    path: kustomization/overlays/prod
    repoURL: "https://github.com/skaramicke/tpl_phoenix_pg_k8s_tilt"
    targetRevision: HEAD
  destination:
    namespace: default
    server: "https://kubernetes.default.svc"
  pullSecret: tpl-phoenix-pg-k8s-tilt-pull-secret
