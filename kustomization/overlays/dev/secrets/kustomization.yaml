apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: distribution-secret
    namespace: tpl-phoenix-pg-k8s-tilt
    envs: [server-secret.env]
  - name: cnpg-app-credentials
    namespace: tpl-phoenix-pg-k8s-tilt
    type: kubernetes.io/basic-auth
    envs: [cnpg-app-secret.env]
  - name: cnpg-superuser-credentials
    namespace: tpl-phoenix-pg-k8s-tilt
    type: kubernetes.io/basic-auth
    envs: [cnpg-superuser-secret.env]
