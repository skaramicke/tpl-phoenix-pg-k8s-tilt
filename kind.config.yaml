# kind: map ports 80/443 from your host and prep nodes for ingress
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tpl-phoenix-pg-k8s-tilt
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 4000
        hostPort: 4000
        protocol: TCP
  - role: worker
  - role: worker
  - role: worker
